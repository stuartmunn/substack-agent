services:
  humblebrag:
    build: .
    restart: unless-stopped
    environment:
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?set TELEGRAM_CHAT_ID in .env}
      CLAUDE_MODEL: ${CLAUDE_MODEL:?set CLAUDE_MODEL in .env}
      SUBSTACK_PUBLICATION_URL: ${SUBSTACK_PUBLICATION_URL:?set SUBSTACK_PUBLICATION_URL in .env}
      RUN_TIME: ${RUN_TIME:-08:30}
      TZ: ${TZ:-Europe/London}
      POST_MIN_WORDS: ${POST_MIN_WORDS:-250}
      POST_MAX_WORDS: ${POST_MAX_WORDS:-600}
      MAX_PENDING_DRAFTS: ${MAX_PENDING_DRAFTS:-7}
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      SUBSTACK_COOKIE_FILE: /run/secrets/substack_cookie
    secrets:
      - telegram_bot_token
      - anthropic_api_key
      - substack_cookie
    volumes:
      - humblebrag-data:/data

secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
  anthropic_api_key:
    file: ./secrets/anthropic_api_key
  substack_cookie:
    file: ./secrets/substack_cookie

volumes:
  humblebrag-data:
