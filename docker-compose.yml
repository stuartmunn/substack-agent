services:
  humblebrag:
    build: .
    restart: unless-stopped
    environment:
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      CLAUDE_MODEL: ${CLAUDE_MODEL}
      SUBSTACK_PUBLICATION_URL: ${SUBSTACK_PUBLICATION_URL}
      RUN_TIME: ${RUN_TIME:-08:30}
      TZ: ${TZ:-Europe/London}
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      SUBSTACK_COOKIE_FILE: /run/secrets/substack_cookie
    secrets:
      - telegram_bot_token
      - anthropic_api_key
      - substack_cookie
    volumes:
      - humblebrag-data:/data

secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
  anthropic_api_key:
    file: ./secrets/anthropic_api_key
  substack_cookie:
    file: ./secrets/substack_cookie

volumes:
  humblebrag-data:
