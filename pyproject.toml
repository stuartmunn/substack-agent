[project]
name = "humblebrag"
version = "0.0.0"
description = "Sir Humblebrag III: a daily parody Substack post agent"
requires-python = ">=3.12"
dependencies = [
    "anthropic==2.10.0",
    "python-substack==0.10.0",
    "python-telegram-bot==22.8",
    "requests==2.31.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyyaml==6.0.2", "pytest-asyncio==1.5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py312"
